<!doctype html>
<html><head><meta charset="utf-8"><title>KleerCard media test</title>
<style>
body{margin:0;font-family:system-ui;background:#f6f5f2}
section{position:relative;min-height:80vh;padding:80px 24px;display:grid;place-items:center;
 background-color:#fbfaf8;background-image:radial-gradient(#d9d5cc 1px,transparent 1px);background-size:18px 18px}
.card{width:min(900px,100%);aspect-ratio:16/9}
video{width:100%;height:100%;display:block}
</style></head><body>
<section>
  <div class="card">
    <video autoplay muted loop playsinline preload="metadata" poster="close-poster.jpg">
      <!-- When you have the Safari HEVC-alpha export, add it FIRST:
      <source src="close.mov" type='video/mp4; codecs="hvc1"'> -->
      <source src="close.webm" type="video/webm">
      <source src="close.mp4" type="video/mp4">
    </video>
  </div>
</section>
</body></html>
